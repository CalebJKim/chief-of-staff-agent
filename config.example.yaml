# Merge these keys into the target profile's config.yaml.
# Keep the user's model/provider configuration and other platform settings.

platform_toolsets:
  cli:
    - skills
    - terminal

# Optional: keep the visible skill catalog minimal for a dedicated profile.
# Configure this interactively with `hermes skills config`; do not copy a
# machine-specific disabled list into another profile.
skills:
  # Repository-managed demo skills are read-only during runs.
  creation_nudge_interval: 0

agent:
  # The workflow normally needs only terminal + skills.
  max_turns: 40
