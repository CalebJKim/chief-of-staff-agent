# These are the repository-managed settings for the dedicated demo profile.
# The normal Hermes profile and its model/provider settings remain unchanged.

model:
  default: qwen3.6:35b-a3b-mtp-q4_K_M
  provider: ollama
  base_url: http://localhost:11434/v1

providers:
  ollama:
    name: Qwen3.6 35BA3B MTP
    base_url: http://localhost:11434/v1
    model: qwen3.6:35b-a3b-mtp-q4_K_M
    discover_models: false
    models:
      qwen3.6:35b-a3b-mtp-q4_K_M: {}

platform_toolsets:
  cli:
    - skills
    - terminal

# Optional: keep the visible skill catalog minimal for a dedicated profile.
# Configure this interactively with `hermes skills config`; do not copy a
# machine-specific disabled list into another profile.
skills:
  # Repository-managed demo skills are read-only during runs.
  creation_nudge_interval: 0

agent:
  # The workflow normally needs only terminal + skills.
  max_turns: 40
  reasoning_effort: medium
