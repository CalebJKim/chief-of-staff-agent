[package]
name = "cos-actions"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
chrono = "0.4"
regex = "1"
html-escape = "0.2"
url = "2"
unicode-casefold = "0.2"
clap = { version = "4", features = ["string"] }
mailparse = "0.16"
mail-builder = "0.4"
tempfile = "3"
chrono-tz = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Pdf", "Graphics_Imaging", "Storage_Streams", "Foundation", "UI", "Win32_System_WinRT"] }
windows-future = "0.3"

[profile.release]
opt-level = 3
lto = true
strip = true
